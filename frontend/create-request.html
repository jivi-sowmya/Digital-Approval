<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Request</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>

/* PAGE */
body{
margin:0;
font-family:Segoe UI, sans-serif;
background:#f4f6fb;
color:#333;
}
.layout{display:flex;}
.content{flex:1;padding:40px;}
h1{margin-bottom:5px}
.subtitle{color:#666;margin-bottom:30px}

/* NAVBAR */
.navbar{
background:#0b1b3f;
color:#fff;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{font-weight:700;font-size:20px}
.nav-right button{
background:#ff4d4d;
border:none;
padding:8px 14px;
color:#fff;
border-radius:8px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#07122c;
min-height:100vh;
padding-top:20px;
}
.sidebar a{
display:block;
color:#fff;
padding:14px 25px;
text-decoration:none;
opacity:.8;
}
.sidebar a.active,
.sidebar a:hover{
background:#16275a;
opacity:1;
}

/* FORM CARD */
.form{
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
max-width:800px;
}

/* INPUT */
.form-group{margin-bottom:18px}
label{font-weight:600;display:block;margin-bottom:6px;}
input,select,textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #dfe3f0;
font-size:14px;
}
input:focus,select:focus,textarea:focus{
outline:none;
border-color:#5c7cfa;
box-shadow:0 0 0 2px rgba(92,124,250,0.2);
}

/* BUTTON */
.primary-btn{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#5c7cfa,#7b5cff);
color:#fff;
font-size:16px;
cursor:pointer;
transition:.3s;
}
.primary-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(92,124,250,.3);
}

/* CONDITIONAL */
.conditional-section{display:none;margin-top:15px}

/* UPLOAD GRID */
.upload-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:18px;
margin-top:15px;
}
.upload-card{
background:#f8f9ff;
border-radius:16px;
padding:18px;
transition:.3s;
border:1px solid #e3e7ff;
}
.upload-card:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,0.1);
}
.upload-box{
border:2px dashed #cfd7ff;
padding:25px;
border-radius:12px;
text-align:center;
position:relative;
cursor:pointer;
background:#fff;
}
.upload-box:hover{
background:#eef1ff;
border-color:#5c7cfa;
}
.upload-box input{
position:absolute;
width:100%;
height:100%;
opacity:0;
left:0;
top:0;
cursor:pointer;
}
.upload-box span{
font-size:14px;
color:#666;
}
.section-title{margin-top:25px;margin-bottom:10px;}

</style>
</head>
<body>

<script>
if(localStorage.getItem("userRole")!=="employee"){
window.location.href="login.html";
}
</script>

<header class="navbar">
<div class="logo">ApprovalFlow</div>
<div class="nav-right">
<span>🔔</span>
<span>Employee</span>
<button onclick="logout()">Logout</button>
</div>
</header>

<div class="layout">

<aside class="sidebar">
<a href="employee-dashboard.html">🏠 Dashboard</a>
<a class="active">➕ Create Request</a>
<a href="my-requests.html">📄 My Requests</a>
</aside>

<main class="content">

<h1>Create Request</h1>
<p class="subtitle">Submit a new request for approval</p>

<form class="form" onsubmit="submitRequest(event)">

<!-- REQUEST TYPE -->
<div class="form-group">
<label>Request Type</label>
<select id="requestType" required onchange="toggleFields()">
<option value="">Select Request Type</option>
<option value="Leave">Leave</option>
<option value="Purchase">Purchase</option>
<option value="Expense">Expense</option>
<option value="Loan">Loan</option>
</select>
</div>

<!-- TITLE -->
<div class="form-group">
<label>Title</label>
<input type="text" id="title" required>
</div>

<!-- PURCHASE -->
<div id="purchaseFields" class="conditional-section">

<div class="form-group">
<label>Purchase Date</label>
<input type="text" id="purchaseDate">
</div>

<div class="form-group">
<label>Amount</label>
<input type="number" id="amount">
</div>

<div class="form-group">
<label>Bill / Invoice</label>
<input type="file" id="file">
</div>

</div>

<!-- LEAVE -->
<div id="leaveFields" class="conditional-section">

<div class="form-group">
<label>From Date</label>
<input type="text" id="fromDate">
</div>

<div class="form-group">
<label>From Time</label>
<input type="text" id="fromTime">
</div>

<div class="form-group">
<label>To Date</label>
<input type="text" id="toDate">
</div>

<div class="form-group">
<label>To Time</label>
<input type="text" id="toTime">
</div>

</div>

<!-- LOAN -->
<div id="loanFields" class="conditional-section">

<h3 class="section-title">💳 Loan Information</h3>

<div class="form-group">
<label>Loan Type</label>
<select id="loanType">
<option value="">Select Loan Type</option>
<option value="Personal">Personal</option>
<option value="Education">Education</option>
<option value="Home">Home</option>
<option value="Vehicle">Vehicle</option>
</select>
</div>

<div class="form-group">
<label>Loan Amount</label>
<input type="number" id="loanAmount">
</div>

<div class="form-group">
<label>Loan Purpose</label>
<textarea rows="3"></textarea>
</div>

<h3 class="section-title">📁 Required Documents</h3>

<div class="upload-grid">

<div class="upload-card">
<label>🪪 Identity Proof</label>
<div class="upload-box">
<input type="file" id="identityProof">
<span id="identityProofName">Click to upload</span>
</div>
</div>

<div class="upload-card">
<label>💰 Salary Proof</label>
<div class="upload-box">
<input type="file" id="salaryProof">
<span id="salaryProofName">Upload files</span>
</div>
</div>

<div class="upload-card">
<label>🏦 Bank Statement</label>
<div class="upload-box">
<input type="file" id="bankStatement">
<span id="bankStatementName">Select file</span>
</div>
</div>

<div class="upload-card">
<label>📎 Supporting Document</label>
<div class="upload-box">
<input type="file" id="supportDoc">
<span id="supportDocName">Attach file</span>
</div>
</div>

</div>
</div>

<!-- DESCRIPTION -->
<div class="form-group">
<label>Description</label>
<textarea id="description" rows="4" required></textarea>
</div>

<button class="primary-btn" type="submit">Submit Request</button>

</form>
</main>
</div>

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>

/* FIELD TOGGLER */
function toggleFields(){
const type=document.getElementById("requestType").value;

document.querySelectorAll(".conditional-section")
.forEach(el=>el.style.display="none");

if(type==="Leave")
document.getElementById("leaveFields").style.display="block";

if(type==="Purchase"||type==="Expense")
document.getElementById("purchaseFields").style.display="block";

if(type==="Loan")
document.getElementById("loanFields").style.display="block";
}

/* DATE PICKERS */
flatpickr("#fromDate",{dateFormat:"d M Y"});
flatpickr("#toDate",{dateFormat:"d M Y"});
flatpickr("#purchaseDate",{dateFormat:"d M Y"});
flatpickr("#fromTime",{enableTime:true,noCalendar:true,dateFormat:"h:i K"});
flatpickr("#toTime",{enableTime:true,noCalendar:true,dateFormat:"h:i K"});

/* FILE PREVIEW */
document.querySelectorAll(".upload-box input").forEach(input=>{
input.addEventListener("change",()=>{
const span=document.getElementById(input.id+"Name");
if(input.files.length>0){
span.textContent="✔ "+input.files[0].name;
span.style.color="#2e7d32";
}
});
});

</script>

</body>
</html>
