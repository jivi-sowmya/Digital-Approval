    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
      (function () {
        const original = window.flatpickr;
        if (!original) return;
        window.flatpickr = function (element, options) {
          const opts = options || {};
          const shouldGuard = element && element.dataset && element.dataset.guard === "no-past";
          if (shouldGuard && !opts.noCalendar) {
            const userOnChange = opts.onChange;
            opts.onChange = function (selectedDates, dateStr, instance) {
              if (selectedDates && selectedDates[0]) {
                const picked = new Date(
                  selectedDates[0].getFullYear(),
                  selectedDates[0].getMonth(),
                  selectedDates[0].getDate()
                );
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (picked < today) {
                  if (window.__showUiAlert) {
                    window.__showUiAlert("Previous dates are not applicable.");
                  } else {
                    alert("Previous dates are not applicable.");
                  }
                  instance.clear();
                  return;
                }
              }
              if (Array.isArray(userOnChange)) {
                userOnChange.forEach((fn) => fn(selectedDates, dateStr, instance));
              } else if (typeof userOnChange === "function") {
                userOnChange(selectedDates, dateStr, instance);
              }
            };
          }
          return original(element, opts);
        };
      })();
    </script>
